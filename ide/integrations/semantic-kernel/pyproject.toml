[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-kernel-superlocalmemory"
version = "0.1.0"
description = "Semantic Kernel VectorStoreCollection backed by a local SuperLocalMemory data root"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Varun Pratap Bhardwaj" },
]
keywords = ["semantic-kernel", "memory", "vector-store", "local-first", "privacy", "sqlite", "agents", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Upstream dependency contract opened 2026-10-11:
# https://pypi.org/pypi/semantic-kernel/json
# SLM runs separately through SLM_ENGINE_PYTHON; do not embed its runtime here.
dependencies = [
    "semantic-kernel>=1.34.0",
]

[project.urls]
Homepage = "https://github.com/qualixar/superlocalmemory"
Documentation = "https://superlocalmemory.com/"
Repository = "https://github.com/qualixar/superlocalmemory"

[tool.hatch.build.targets.wheel]
packages = ["semantic_kernel_superlocalmemory"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
package = "semantic_kernel_superlocalmemory"

[tool.hatch.build.targets.sdist]
include = ["semantic_kernel_superlocalmemory", "hatch_build.py", "pyproject.toml", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
